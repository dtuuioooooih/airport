  <style>
    * {

    html,

      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 2;
      pointer-events: none;
    }

    .hero-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(42vw, 420px);
      max-width: 85%;
      height: auto;
      z-index: 3;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.4));
      user-select: none;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .hero {
        min-height: 520px;
      }

      .hero-logo {
        width: min(70vw, 330px);
      }
    }
